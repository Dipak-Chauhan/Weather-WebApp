<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Current weather, air quality, and a five-day forecast for cities worldwide.">
    <title>Weather Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
    <div class="bg-overlay" id="bgOverlay" aria-hidden="true"></div>

    <main class="dashboard" aria-label="Weather dashboard">
        <header class="search-header">
            <form id="searchForm" class="search-bar">
                <i class="ri-search-line search-icon"></i>
                <label class="sr-only" for="searchInput">Search for a city</label>
                <input type="search" id="searchInput" placeholder="Search for a city..." autocomplete="off" required>
                <button type="button" id="locationBtn" class="icon-btn" aria-label="Use Current Location" title="Current Location">
                    <i class="ri-map-pin-user-fill"></i>
                </button>
                <button type="submit" class="icon-btn search-submit" aria-label="Search">
                    <i class="ri-arrow-right-line"></i>
                </button>
            </form>
            <div class="recent-searches" id="recentSearches" aria-label="Recent searches"></div>
        </header>

        <div class="loader-container" id="loader" hidden aria-live="polite">
            <div class="spinner"></div>
            <p>Fetching weather data...</p>
        </div>

        <div class="error-state" id="errorState" hidden role="alert">
            <img src="assets/images/error.png" alt="" class="error-img">
            <h2 id="errorMessage">Location not found</h2>
            <p id="errorDetail">Please try a different search term.</p>
        </div>

        <div class="weather-content" id="weatherContent" hidden>
            <div class="top-row">
                <section class="current-weather card hero-card">
                    <div class="hero-header">
                        <div>
                            <h1 class="city-name" id="cityName">--</h1>
                            <span class="country-badge" id="countryBadge">--</span>
                        </div>
                        <span class="date-info" id="currentDate">--</span>
                    </div>
                    
                    <div class="hero-body">
                        <img src="assets/images/clearatday.png" alt="" class="main-weather-icon" id="mainWeatherIcon">
                        <div class="temp-wrapper">
                            <h2 class="temp" id="currentTemp">--°</h2>
                            <p class="description" id="weatherDesc">--</p>
                        </div>
                    </div>
                </section>

                <section class="details-grid">
                    <div class="card detail-card">
                        <div class="detail-header">
                            <i class="ri-temp-hot-line"></i>
                            <span>Feels Like</span>
                        </div>
                        <h3 id="feelsLike">--°</h3>
                    </div>

                    <div class="card detail-card">
                        <div class="detail-header">
                            <i class="ri-mist-fill"></i>
                            <span>Humidity</span>
                        </div>
                        <h3 id="humidity">--%</h3>
                    </div>

                    <div class="card detail-card">
                        <div class="detail-header">
                            <i class="ri-windy-fill"></i>
                            <span>Wind Speed</span>
                        </div>
                        <h3 id="windSpeed">-- km/h</h3>
                    </div>

                    <div class="card detail-card" id="aqiCard">
                        <div class="detail-header">
                            <i class="ri-bubble-chart-line"></i>
                            <span>Air Quality</span>
                        </div>
                        <div class="aqi-body">
                            <h3 id="aqiValue">--</h3>
                            <span class="aqi-badge" id="aqiStatus">--</span>
                        </div>
                    </div>

                    <div class="card detail-card">
                        <div class="detail-header">
                            <i class="ri-compasses-2-line"></i>
                            <span>Pressure</span>
                        </div>
                        <h3 id="pressure">-- hPa</h3>
                    </div>

                    <div class="card detail-card">
                        <div class="detail-header">
                            <i class="ri-eye-line"></i>
                            <span>Visibility</span>
                        </div>
                        <h3 id="visibility">-- km</h3>
                    </div>

                    <div class="card detail-card sunrise-sunset">
                        <div class="sun-item">
                            <i class="ri-sunrise-line"></i>
                            <div>
                                <span class="label">Sunrise</span>
                                <span class="time" id="sunriseTime">--:--</span>
                            </div>
                        </div>
                        <div class="sun-item">
                            <i class="ri-sunset-line"></i>
                            <div>
                                <span class="label">Sunset</span>
                                <span class="time" id="sunsetTime">--:--</span>
                            </div>
                        </div>
                    </div>
                </section>
            </div>

            <section class="forecast-section card">
                <h3 class="section-title">5-Day Forecast</h3>
                <div class="forecast-container" id="forecastContainer"></div>
            </section>
        </div>
    </main>

    <script type="module" src="assets/js/app.js"></script>
</body>
</html>
